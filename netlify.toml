[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # NEXT_PUBLIC_* values are inlined into the client bundle by design — the
  # browser cannot talk to Supabase without them. Netlify's secrets scanner
  # flags any env value it finds in the build output, so these three are
  # declared as intentionally public. None of them is a secret:
  #   - SITE_URL is the public address of this site
  #   - SUPABASE_URL is the public project endpoint
  #   - SUPABASE_ANON_KEY is the publishable browser key; row level security,
  #     not key secrecy, is what protects the data
  # Never add a service-role or secret key to this list.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY"

[[plugins]]
  package = "@netlify/plugin-nextjs"
